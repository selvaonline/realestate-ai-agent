site_name: DealSense Multi-Agent
site_description: >-
  Supervisor-orchestrated multi-agent system for commercial real estate
  private equity analysis — a LangGraph.js agent team on a pack-based platform.
site_author: Selvakumar Murugesan
repo_url: https://github.com/selvaonline/realestate-ai-agent
repo_name: realestate-ai-agent

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    logo: material/home-city
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Orchestrators:
      - LangGraph.js Orchestrator: orchestrators.md
  - Reference:
      - Agents & Tools: reference/agents-and-tools.md
      - API: reference/api.md
  - Evals: evals.md
  - UI Guide: ui-guide.md
